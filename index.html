<style>

.cards{display:flex;gap:1em;justify-content:center;flex-wrap:wrap}

.lineup{display:flex;flex-direction:column;gap:.3em;max-width:46em;margin:0 auto}
.lu{display:flex;align-items:center;gap:.6em;background:#1a120c;border:3px solid #3a2c20;padding:.15em .5em;box-shadow:2px 2px 0 #000}
#setup h3{margin:.55em 0 .25em}#setup .hint{margin-top:.25em}#setup h2{margin:.2em 0 .3em}

.lslots{display:grid;grid-template-columns:repeat(4,1fr);gap:.5em;max-width:62em;margin:0 auto .6em}

.lslot.empty{justify-content:center;opacity:.75;border-style:dashed}.lslot.ready{background:#16200f}
.lsp{width:7.5em;height:6.5em;image-rendering:pixelated}.lsn{font-family:'Press Start 2P',monospace;font-size:.62em}
.lcols{display:flex;gap:.15em;flex-wrap:wrap;justify-content:center}.lcols .psw{width:1.35em;height:1.35em}.lst{font-size:.85em;color:#a8957a}

.llist{display:flex;flex-direction:column;gap:.3em;min-width:30em}.lrow{display:flex;align-items:center;gap:.8em;background:#1a120c;border:3px solid #3a2c20;padding:.2em .6em}
.lrow b{font-family:'Press Start 2P',monospace;color:#ffd27a;font-size:.8em;letter-spacing:2px}.lrow span{flex:1;text-align:left;color:#c8b694}
.mapgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:.45em;max-width:min(58em,90vw);margin:0 auto}
.mtile{display:flex;flex-direction:column;align-items:center;padding:.35em .35em .4em;background:#1a120c;border:2px solid #4a3b2c;color:#8a7a68;cursor:pointer;font:inherit;box-shadow:3px 3px 0 #000;opacity:.6}
.mtile.on{border-color:#d9a441;color:#ffe9b8;opacity:1}
.mtile canvas{width:100%;image-rendering:pixelated;margin-bottom:.25em;border:1px solid #000}
.mtile b{font-size:.62em;font-family:'Press Start 2P',monospace;line-height:1.4}.mtile span{font-size:.85em}
.mtile.focus,.mtile:hover{outline:3px solid #ffd27a}
.cards.deal{position:relative}
.cslot{animation:cdeal .42s cubic-bezier(.2,1.35,.45,1) backwards,cfloat 3.4s ease-in-out infinite;animation-delay:calc(.34s + var(--i)*.06s - var(--e)),calc(.8s + var(--i)*.06s + var(--i)*.4s - var(--e));will-change:transform}
@keyframes cdeal{from{transform:translate(calc(var(--dx)*12.5em),9em) scale(.12) rotate(var(--rot));opacity:0;filter:brightness(3)}40%{opacity:1}to{transform:none;filter:none}}
@keyframes cfloat{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-6px) rotate(.6deg)}70%{transform:translateY(4px) rotate(-.6deg)}}
.chest{position:absolute;left:50%;bottom:-3.5em;width:7.2em;height:6.6em;margin-left:-3.6em;pointer-events:none;z-index:3;animation:chestIn .18s steps(3) backwards,chestOut .3s steps(4) forwards;animation-delay:calc(0s - var(--e)),calc(.95s - var(--e))}
.chest svg{position:absolute;left:0;width:100%;image-rendering:pixelated}
.chest .cbase{bottom:0;height:3.6em}.chest .clid{bottom:3.3em;height:2.4em;transform-origin:85% 100%;animation:lidOpen .2s steps(3) forwards;animation-delay:calc(.17s - var(--e))}
.chest .cglow{position:absolute;left:10%;right:10%;bottom:2.6em;height:1.2em;background:radial-gradient(ellipse at 50% 100%,#fff6c0,#ffd27a 35%,transparent 70%);opacity:0;animation:cglow .7s ease-out forwards;animation-delay:calc(.25s - var(--e))}
@keyframes chestIn{from{transform:translateY(1.2em) scale(.6);opacity:0}}
@keyframes chestOut{to{transform:translateY(.6em) scale(.8);opacity:0}}
@keyframes lidOpen{to{transform:translate(-.6em,-1.1em) rotate(-28deg)}}
@keyframes cglow{0%{opacity:0;transform:scaleY(.4)}25%{opacity:1;transform:scaleY(3.2)}100%{opacity:0;transform:scaleY(5)}}
.card{width:11.5em;min-height:16.5em;background:linear-gradient(#150f2e,#08061a);color:var(--ink);border-radius:8px;padding:.8em .8em 1em;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:center;position:relative;transition:transform .12s,box-shadow .12s;border:2px solid var(--c0);box-shadow:0 0 10px rgba(200,212,234,.2),inset 0 0 14px rgba(200,212,234,.06);font-family:Rajdhani}
.card.r1{border-color:var(--c1);box-shadow:0 0 12px rgba(63,246,255,.35),inset 0 0 16px rgba(63,246,255,.08)}
.card.r2{border-color:var(--c2);box-shadow:0 0 16px rgba(255,61,242,.5),inset 0 0 18px rgba(255,61,242,.1)}
.card.focus,.card:hover{transform:translateY(-10px) scale(1.05);box-shadow:0 0 26px rgba(255,255,255,.45)}
.card.chosen{transform:translateY(-24px) scale(1.12);box-shadow:0 0 0 2px #fff,0 0 40px rgba(255,255,255,.7)}
.card .ty{font-family:Orbitron;font-size:.58em;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.card .ic{width:3.6em;height:3.6em;margin:.45em 0}
.card .ic svg{width:100%;height:100%;overflow:visible}
.card .n{font-family:Orbitron;font-size:1em;font-weight:700;line-height:1.15;margin-bottom:.35em;letter-spacing:.04em}
.card .d{font-size:.95em;color:#a9abcc;line-height:1.2;margin-bottom:.5em}
.card .l{font-size:.92em;font-weight:700;width:100%;text-align:left;padding:.08em .35em;border-radius:3px;margin-top:.14em}
.card .l.p{color:#7dffa8;background:rgba(60,255,140,.1)}.card .l.m{color:#ff7a8e;background:rgba(255,60,90,.1)}
.card .rar{position:absolute;top:.55em;right:.6em;font-family:Orbitron;font-size:.5em;letter-spacing:.15em;text-transform:uppercase}
.r0 .rar{color:var(--c0)}.r1 .rar{color:var(--c1)}.r2 .rar{color:var(--c2)}.r3 .rar{color:#ffb13d}
.card.r3{border-color:#ffb13d;background:linear-gradient(#2a1a10,#0d0712);box-shadow:0 0 22px rgba(255,177,61,.55),inset 0 0 22px rgba(255,177,61,.14);animation:lg 1.6s ease-in-out infinite alternate}
@keyframes lg{from{box-shadow:0 0 12px rgba(255,177,61,.35),inset 0 0 16px rgba(255,177,61,.1)}to{box-shadow:0 0 30px rgba(255,177,61,.75),inset 0 0 26px rgba(255,177,61,.2)}}
.card.r3 .n{color:#ffd27a}
.minis{display:flex;gap:.3em;flex-wrap:wrap;justify-content:center;max-width:40em}
.mini{font-size:.9em;padding:.12em .55em;border-radius:3px;background:rgba(10,6,30,.9);border:1px solid var(--c0);font-weight:700}
.mini.r1{border-color:var(--c1)}.mini.r2{border-color:var(--c2)}.mini.r3{border-color:#ffb13d;color:#ffd27a}
.lib{display:flex;flex-wrap:wrap;gap:.7em;justify-content:center;max-width:76em}
.lib .card{width:10.5em;min-height:15em;font-size:.9em;cursor:default}
.lib .card:hover{transform:none}
.keys{display:grid;grid-template-columns:auto auto;gap:.3em 1.4em;text-align:left;font-size:1.05em;max-width:36em}
.keys b{font-family:Orbitron;font-weight:500;font-size:.8em;color:var(--cy);align-self:center}
.keys span{color:var(--dim)}
.help b{color:var(--cy)}
.hint{color:var(--dim);font-size:1em;margin-top:.8em}
.pickhead{font-family:Orbitron;font-weight:700;font-size:1.8em;margin:0 0 .3em;letter-spacing:.06em}
.score{font-family:Orbitron;font-size:1.05em;margin-bottom:1em;color:var(--dim);letter-spacing:.1em}
.decks{display:flex;gap:2em;justify-content:center;margin-top:1.4em;flex-wrap:wrap}
.decks>div{max-width:30em}
.cust{display:flex;gap:1.6em;align-items:flex-start;justify-content:center;flex-wrap:wrap;max-width:62em}
.cust .opts{display:flex;flex-direction:column;align-items:stretch;min-width:24em;max-width:32em}
.cust .opts h3{text-align:left;margin:.7em 0 .3em}
.cust .seg{justify-content:flex-start}
#prevC{width:22em;height:17em;background:radial-gradient(#1a0f3a,#05030f);border:1px solid #3a2a7a;border-radius:6px;box-shadow:0 0 22px rgba(155,92,255,.3)}
.sw{width:1.9em;height:1.9em;border-radius:50%;border:2px solid #2c2a5a;cursor:pointer;padding:0;margin:.1em}
.sw.sel,.sw.focus{border-color:#fff;box-shadow:0 0 10px #fff}
.nm{font-family:Orbitron,system-ui,sans-serif;font-size:1em;background:rgba(10,6,30,.9);border:1px solid var(--cy);color:#fff;padding:.45em .7em;border-radius:3px;outline:none;letter-spacing:.06em;width:100%;box-sizing:border-box}
.nm:focus{box-shadow:0 0 12px rgba(63,246,255,.6)}
.ctl{display:flex;gap:1.6em;flex-wrap:wrap;justify-content:center;align-items:flex-start}
.ctl>div{width:27em;max-width:100%}
.ctl .row{max-width:none}
.ctl .row .btn.small{min-width:7.2em}
.btn.wait{animation:wb .6s infinite alternate;border-color:#ffd23d}
@keyframes wb{from{box-shadow:0 0 4px #ffd23d}to{box-shadow:0 0 18px #ffd23d}}
.wcards{display:flex;gap:.5em;justify-content:center;flex-wrap:wrap;max-width:80em}
.wcard{width:9.7em;background:linear-gradient(#150f2e,#08061a);border:2px solid #ffd23d55;border-radius:8px;padding:.5em .6em .8em;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:center;transition:transform .12s,box-shadow .12s}
.wcard canvas{width:100%;height:6.4em;image-rendering:pixelated}

.wcard.focus,.wcard:hover{transform:translateY(-8px) scale(1.04);border-color:#ffd23d;box-shadow:0 0 22px rgba(255,210,61,.5)}
.wcard.chosen{transform:translateY(-18px) scale(1.1);border-color:#fff;box-shadow:0 0 36px rgba(255,255,255,.7)}
.bars{width:100%;font-size:.78em;text-align:left}
.bars div{display:flex;align-items:center;gap:.4em;color:var(--dim)}
.bars span{flex:1}.bars i{display:inline-block;width:.75em;height:.42em;margin-left:.15em;background:#2c2a5a;border-radius:1px}.bars i.on{background:#ffd23d;box-shadow:0 0 5px #ffd23d}
.wtag{display:inline-block;font-family:Orbitron;font-size:.75em;letter-spacing:.12em;color:#ffd23d;border:1px solid #ffd23d88;border-radius:3px;padding:.1em .5em;margin-left:.4em;vertical-align:middle;text-transform:uppercase}
.card.wpn{border-color:#ffd23d;box-shadow:0 0 14px rgba(255,210,61,.4),inset 0 0 16px rgba(255,210,61,.08)}
.card.wpn .ty{color:#ffd23d}

/* ===================== RETRO SHOT THEME ===================== */
:root{--p1:#ff9a2e;--p2:#36e0ff;--ink:#eadcc0;--dim:#9c8a70;--c0:#8a8070;--c1:#4f8fd0;--c2:#a65ad6;--gold:#e0a530}

canvas{image-rendering:pixelated}

.panel{background:rgba(8,6,4,.78);font-size:1.15em}

.btn{background:#1d1813;border:3px solid #4a3b2c;border-radius:0;color:#eadcc0;font-size:.62em;letter-spacing:.06em;padding:.9em 1.5em;box-shadow:0 .35em 0 #000;min-width:20em;transition:none}
.btn.small{font-size:.5em;padding:.8em 1.1em;min-width:0}

.card.r1{border-color:#4f8fd0;box-shadow:0 .3em 0 #000}.card.r2{border-color:#a65ad6;box-shadow:0 .3em 0 #000}

<body>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div class="panel on" id="title"></div>
  <div class="panel" id="setup"></div>
  <div class="panel" id="pick"></div>
  <div class="panel" id="end"></div>

  <div class="panel" id="settings"></div>

  <div class="panel" id="lobby"></div>
  <div class="panel" id="custom"></div>

  <div id="demoTag">BOT EXHIBITION &middot; PRESS ANY KEY TO RETURN</div>
</div>
<script>
'use strict';
/* =====================================================================
   RETRO SHOT — pixel/powder edition of Shapeshot (same simulation, different renderer)
   Structure: DATA (cards, maps) · SIM (fixed 60 Hz, input-driven) ·
   INPUT (keyboard/mouse, gamepads, bot) · RENDER · UI
   The sim only reads per-player input objects so it can later be driven
   by a network server.
   ===================================================================== */
const W = 1280, H = 720, TAU = Math.PI * 2, DT = 1 / 60;
const cv = document.getElementById('cv'), ctx = cv.getContext('2d'), wrap = document.getElementById('wrap');
const rnd = (a, b) => a + Math.random() * (b - a), clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pick = a => a[Math.floor(Math.random() * a.length)];
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
let scale = 1;
function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  const w = Math.floor(W * s), h = Math.floor(H * s); scale = s;
  wrap.style.width = w + 'px'; wrap.style.height = h + 'px'; wrap.style.fontSize = (16 * Math.max(.55, s)) + 'px';
  const dpr = Math.min(2, devicePixelRatio || 1);
  cv.width = Math.floor(w * dpr); cv.height = Math.floor(h * dpr);
  ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
}
addEventListener('resize', fit); fit();

/* ============================ SETTINGS ============================ */
const SKEY = 'retroshot_settings_v1';
const SET = Object.assign({ bot: 'normal', points: 5, rounds: 2, shake: true, sound: true, nums: true, speed: 1 }, (() => { try { return JSON.parse(localStorage.getItem(SKEY)) || {}; } catch (e) { return {}; } })());
const LOOKS = {
  colors: [['Neon Orange', '#ff9a2e'], ['Cyan', '#36e0ff'], ['Magenta', '#ff3df2'], ['Lime', '#b6ff3d'], ['Violet', '#9b5cff'], ['Gold', '#ffd23d'], ['Red', '#ff3d5a'], ['Mint', '#6af0c8'], ['Pink', '#ff7ab8'], ['Ice', '#c8f4ff']],
  shapes: [['Robe', 'circle'], ['Battlemage', 'square'], ['Hooded', 'hex'], ['Gnome', 'triangle'], ['Spirit', 'blob']],
  eyes: [['Classic', 'normal'], ['Angry', 'angry'], ['Happy', 'happy'], ['Glowing', 'visor'], ['Cyclops', 'cyclops'], ['Sleepy', 'sleepy'], ['Spectacles', 'specs']],
  hats: [['Wizard hat', 'wizard'], ['Witch hat', 'witch'], ['Wide brim', 'brim'], ['Hood', 'hood'], ['Crown', 'crown'], ['Horns', 'horns'], ['Halo', 'halo'], ['Top hat', 'tophat'], ['Feathered cap', 'feather'], ['Toadstool', 'mushroom'], ['Bare head', 'none']],
  guns: [['Match robe', 'body'], ['White', '#ffffff'], ['Gold', '#ffd23d'], ['Cyan', '#3ff6ff'], ['Magenta', '#ff3df2'], ['Lime', '#b6ff3d']]
};
const DEFAULT_PROF = [{ name: 'Player 1', col: '#ff9a2e', shape: 'circle', eyes: 'normal', hat: 'wizard', gun: 'body' }, { name: 'Player 2', col: '#36e0ff', shape: 'hex', eyes: 'angry', hat: 'witch', gun: 'body' }];
if (!Array.isArray(SET.prof) || SET.prof.length < 2) SET.prof = JSON.parse(JSON.stringify(DEFAULT_PROF));
if (!SET.wizards) { SET.wizards = 1; SET.prof.forEach((p, i) => { if (!LOOKS.hats.some(h => h[1] === p.hat) || p.hat === 'none') p.hat = i ? 'witch' : 'wizard'; }); } // first run of the wizard edition
function randomLook(avoidCol) {
  const cols = LOOKS.colors.map(c => c[1]).filter(c => c !== avoidCol);
  return { name: 'Bot', col: pick(cols), shape: pick(LOOKS.shapes)[1], eyes: pick(LOOKS.eyes)[1], hat: pick(LOOKS.hats)[1], gun: pick(LOOKS.guns)[1] };
}
const saveSet = () => { try { localStorage.setItem(SKEY, JSON.stringify(SET)); } catch (e) {} };
// ---- control bindings ----
const DEF_KEYS = () => ({ left: ['KeyA', 'ArrowLeft'], right: ['KeyD', 'ArrowRight'], jump: ['KeyW', 'Space'], shoot: ['Mouse0', ''], block: ['Mouse2', 'ShiftLeft'], pause: ['Escape', 'KeyP'] });
const DEF_PAD = () => ({ jump: [0, -1], shoot: [7, 5], block: [6, 4], pause: [9, -1] });
const ACTIONS = [['left', 'Move left'], ['right', 'Move right'], ['jump', 'Jump · wall jump'], ['shoot', 'Shoot'], ['block', 'Block'], ['pause', 'Pause']];
const PAD_ACTIONS = [['jump', 'Jump · wall jump'], ['shoot', 'Shoot'], ['block', 'Block'], ['pause', 'Pause']];
function fixBindings() {
  const dk = DEF_KEYS(), dp = DEF_PAD();
  SET.keys = Object.assign(dk, SET.keys && typeof SET.keys === 'object' ? SET.keys : {});
  SET.pad = Object.assign(dp, SET.pad && typeof SET.pad === 'object' ? SET.pad : {});
  for (const k in SET.keys) { const a = SET.keys[k]; SET.keys[k] = [a[0] || '', a[1] || '']; }
  for (const k in SET.pad) { const a = SET.pad[k]; SET.pad[k] = [a[0] ?? -1, a[1] ?? -1]; }
  if (typeof SET.dz !== 'number') SET.dz = .22;
  if (SET.aimLeft === undefined) SET.aimLeft = true;
  if (SET.rumble === undefined) SET.rumble = true;
  if (SET.game !== 'arsenal' && SET.game !== 'dungeon') SET.game = 'classic';
}
fixBindings();
const KEY_NAMES = { Mouse0: 'Left click', Mouse1: 'Middle click', Mouse2: 'Right click', Mouse3: 'Mouse 4', Mouse4: 'Mouse 5', Space: 'Space', ArrowLeft: '←', ArrowRight: '→', ArrowUp: '↑', ArrowDown: '↓', ShiftLeft: 'L-Shift', ShiftRight: 'R-Shift', ControlLeft: 'L-Ctrl', ControlRight: 'R-Ctrl', AltLeft: 'L-Alt', AltRight: 'R-Alt', Escape: 'Esc', Enter: 'Enter', Tab: 'Tab', Backquote: '`', CapsLock: 'Caps', Minus: '-', Equal: '=', BracketLeft: '[', BracketRight: ']', Semicolon: ';', Quote: "'", Comma: ',', Period: '.', Slash: '/', Backslash: '\\' };
function keyLabel(c) { if (!c) return '—'; if (KEY_NAMES[c]) return KEY_NAMES[c]; if (c.startsWith('Key')) return c.slice(3); if (c.startsWith('Digit')) return c.slice(5); if (c.startsWith('Numpad')) return 'Num ' + c.slice(6); return c; }
const PAD_NAMES = ['A', 'B', 'X', 'Y', 'LB', 'RB', 'LT', 'RT', 'Back', 'Start', 'L-Stick', 'R-Stick', 'D-Up', 'D-Down', 'D-Left', 'D-Right', 'Home'];
const padLabel = i => (i === undefined || i === null || i < 0) ? '—' : (PAD_NAMES[i] || 'Button ' + i);
const bindText = a => SET.keys[a].filter(Boolean).map(keyLabel).join(' / ') || '—';
const padText = a => SET.pad[a].filter(i => i >= 0).map(padLabel).join(' / ') || '—';

/* ============================ AUDIO ============================ */
let AC = null; const sl = {};
function audio() { if (!SET.sound) return; try { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch (e) {} }
function sfx(f, d = .08, type = 'square', vol = .05, slide = 0, key) {
  if (!SET.sound || !AC) return;
  if (key) { const n = performance.now(); if (n - (sl[key] || 0) < 40) return; sl[key] = n; }
  try {
    const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d + .02);
  } catch (e) {}
}
function noise(d = .15, vol = .08) {
  if (!SET.sound || !AC) return;
  try { const n = AC.sampleRate * d, buf = AC.createBuffer(1, n, AC.sampleRate), ch = buf.getChannelData(0); for (let i = 0; i < n; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / n); const s = AC.createBufferSource(), g = AC.createGain(); g.gain.value = vol; s.buffer = buf; s.connect(g); g.connect(AC.destination); s.start(); } catch (e) {}
}

/* ============================ VISUAL HOOKS ============================ */
// The sim calls these at key moments. They only add visuals (never change gameplay), so
// different builds (Shapeshot, Retro Shot) can share an identical simulation.
const FX_NOOP = () => {};
const FX = { hit: FX_NOOP, die: FX_NOOP, wall: FX_NOOP, bounce: FX_NOOP, boom: FX_NOOP, shot: FX_NOOP, flameWall: FX_NOOP, edge: FX_NOOP, pad: FX_NOOP, block: FX_NOOP, clash: FX_NOOP, crumble: FX_NOOP, ropeSnap: FX_NOOP };

/* ============================ CARDS ============================ */
// rarity: 0 common · 1 uncommon · 2 rare.  type: bullet · block · utility · passive
const CARDS = {}, CARD_LIST = [];
const hp = (s, p) => { s.maxHp *= 1 + p; }, rl = (s, x) => { s.reload += x; }, dm = (s, p) => { s.dmg *= 1 + p; }, bs = (s, p) => { s.spd *= 1 + p; },
  as = (s, p) => { if (p >= 0) s.atkCd /= 1 + p; else s.atkCd *= 1 - p; }, bc = (s, x) => { s.blockCd += x; };
function C(id, name, rar, type, desc, lines, fx) { CARDS[id] = { id, name, rar, type, desc, lines, fx: fx || (() => {}) }; CARD_LIST.push(id); }
const R25 = ['-', '+0.25s reload time'], R50 = ['-', '+0.5s reload time'], B25 = ['-', '+0.25s block cooldown'];
// ---- bullet · common
C('wide', 'Wide Load', 0, 'bullet', 'Bullets carry a big hit ring, making them far easier to land.', [['+', 'Much bigger bullet hitbox'], R25], s => { s.hitR += 11; rl(s, .25); });
C('triple', 'Triple Tap', 0, 'bullet', 'Each shot fires a quick burst of bullets in sequence.', [['+', '+2 bullets per shot (burst)'], ['+', '+3 ammo'], ['-', '-60% damage'], R25], s => { s.burst += 2; s.ammo += 3; dm(s, -.6); rl(s, .25); });
C('frost', 'Frostbite', 0, 'bullet', 'Hits chill the target, slowing their movement.', [['+', '+70% slow on hit'], R25], s => { s.slowHit += .7; rl(s, .25); });
C('merge', 'Merge', 0, 'bullet', 'Fewer, heavier rounds.', [['+', '+100% damage'], ['-', '-2 ammo'], R50], s => { dm(s, 1); s.ammo -= 2; rl(s, .5); });
C('flash', 'Flashbang', 0, 'bullet', 'Hits briefly stun the target.', [['+', 'Bullets stun on hit'], R25], s => { s.stunHit += .28; rl(s, .25); });
C('hardball', 'Hardball', 0, 'bullet', 'Blisteringly fast bullets, slower trigger.', [['+', '+250% bullet speed'], ['-', '-50% attack speed'], R25], s => { bs(s, 2.5); as(s, -.5); rl(s, .25); });
C('express', 'Express Lane', 0, 'bullet', 'Bullets follow the same arc but get there twice as fast.', [['+', 'Bullets travel 100% faster'], ['+', '+30% reload speed']], s => { s.tscale *= 2; s.reload /= 1.3; });
C('venom', 'Venom', 0, 'bullet', 'Hits deal their damage over 3 seconds instead of instantly. Poison ignores blocks.', [['+', 'Damage over 3s'], ['+', '+60% damage'], ['+', '+30% reload speed']], s => { s.poison = Math.max(s.poison, 3); dm(s, .6); s.reload /= 1.3; });
C('snap', 'Snap Shot', 0, 'bullet', 'Much faster bullets.', [['+', '+150% bullet speed'], R25], s => { bs(s, 1.5); rl(s, .25); });
C('steady', 'Steady Hands', 0, 'bullet', 'A calmer, sturdier shooter.', [['+', '+40% HP'], ['+', '+100% bullet speed'], R25], s => { hp(s, .4); bs(s, 1); rl(s, .25); });
C('sticky', 'Sticky Charge', 0, 'bullet', 'Bullets leave a sticky bomb where they hit, which explodes after half a second.', [['+', 'Sticky bombs on impact'], ['-', '-15% damage'], R25], s => { s.sticky++; dm(s, -.15); rl(s, .25); });
C('coiled', 'Coiled Spring', 0, 'bullet', 'Wind up for big, fast shots.', [['+', '+100% bullet speed'], ['+', '+60% damage'], ['-', '-100% attack speed'], R50], s => { bs(s, 1); dm(s, .6); as(s, -1); rl(s, .5); });
// ---- bullet · uncommon
C('volley', 'Volley', 1, 'bullet', 'Fire a fan of bullets at once.', [['+', '+4 bullets at once'], ['+', '+5 ammo'], ['-', '-70% damage'], R25], s => { s.proj += 4; s.ammo += 5; dm(s, -.7); rl(s, .25); });
C('scatter', 'Scattergun', 1, 'bullet', 'A shotgun spread with random pellet speeds.', [['+', '+4 bullets (shotgun)'], ['+', '+5 ammo'], ['-', '-60% damage'], R25], s => { s.proj += 4; s.buck++; s.ammo += 5; dm(s, -.6); rl(s, .25); });
C('patience', 'Patience', 1, 'bullet', 'Make every shot count.', [['+', '+100% damage'], ['-', '-100% attack speed'], R50], s => { dm(s, 1); as(s, -1); rl(s, .5); });
C('blast', 'Blast Rounds', 1, 'bullet', 'Bullets explode on impact.', [['+', 'Explosive bullets'], ['-', '-100% attack speed'], R25], s => { s.explode++; as(s, -1); rl(s, .25); });
C('snowball', 'Snowball', 1, 'bullet', 'Bullets hit harder the further they travel.', [['+', 'Damage grows with distance'], R25], s => { s.grow++; rl(s, .25); });
C('pinball', 'Pinball', 1, 'bullet', 'Bullets bounce all over the place.', [['+', '+5 bullet bounces'], ['-', '-15% damage'], R50], s => { s.bounces += 5; dm(s, -.15); rl(s, .5); });
C('leechround', 'Leech Rounds', 1, 'bullet', 'Hits drain the target over 5 seconds and heal you.', [['+', 'Damage over 5s'], ['+', '+50% life steal'], ['+', '+30% HP'], ['+', '+25% damage'], R25], s => { s.poison = Math.max(s.poison, 5); s.lifesteal += .5; hp(s, .3); dm(s, .25); rl(s, .25); });
C('rebound', 'Rebound', 1, 'bullet', 'Bullets bounce, slowing a little each time.', [['+', '+2 bullet bounces'], ['+', '+25% attack speed'], R25], s => { s.bounces += 2; s.bounceSlow++; as(s, .25); rl(s, .25); });
C('hose', 'Firehose', 1, 'bullet', 'An inaccurate stream of weak bullets.', [['+', '+1000% attack speed'], ['+', '+12 ammo'], ['-', '-75% damage'], ['-', 'Less accurate'], R25], s => { as(s, 10); s.ammo += 12; dm(s, -.75); s.inacc += .1; rl(s, .25); });
C('seekbounce', 'Seeking Bounce', 1, 'bullet', 'After each bounce, bullets home in on the enemy.', [['+', 'Homing after bounces'], ['+', '+1 bullet bounce'], ['-', '-20% damage'], R25], s => { s.seekBounce++; s.bounces += 1; dm(s, -.2); rl(s, .25); });
C('shoveshot', 'Shove Shot', 1, 'bullet', 'Hits knock the target back hard.', [['+', 'Bullets push targets'], R25], s => { s.push++; rl(s, .25); });
// ---- bullet · rare
C('bloodpact', 'Blood Pact', 2, 'bullet', 'Every shot costs you health, but there is no trigger cooldown and each shot is a storm of bullets that splash.', [['+', '+9 bullets per shot'], ['+', 'No shot cooldown'], ['+', 'Small splash damage'], ['-', 'Costs 10 HP per shot'], R25], s => { s.proj += 9; s.atkCd = 0; s.pact++; s.splash += 1; rl(s, .25); });
C('borer', 'Borer', 2, 'bullet', 'Bullets drill through walls.', [['+', 'Bullets pass through walls'], R25], s => { s.drill += 140; rl(s, .25); });
C('guided', 'Guided', 2, 'bullet', 'Bullets steer toward your aim point.', [['+', 'Steer bullets with your aim'], ['-', '-40% bullet speed'], R25], s => { s.guided++; bs(s, -.4); rl(s, .25); });
C('gascloud', 'Gas Cloud', 2, 'bullet', 'Bullets leave behind clouds of toxic gas.', [['+', 'Poison clouds on impact'], ['-', '-25% damage'], ['-', '-20% attack speed'], R50], s => { s.gas++; dm(s, -.25); as(s, -.2); rl(s, .5); });
C('trick', 'Trick Shot', 2, 'bullet', 'Every bounce makes the bullet stronger.', [['+', '+80% damage per bounce'], ['+', '+2 bullet bounces'], ['-', '-20% damage'], R50], s => { s.trick += .8; s.bounces += 2; dm(s, -.2); rl(s, .5); });
// ---- block
C('coldsnap', 'Cold Snap', 0, 'block', 'Blocking slows nearby enemies.', [['+', 'Block: slow nearby enemies'], ['+', '+30% HP'], B25], s => { hp(s, .3); bc(s, .25); });
C('mend', 'Mending Ward', 0, 'block', 'Blocking creates a field that heals you.', [['+', 'Block: healing field'], ['+', '+30% HP'], B25], s => { hp(s, .3); bc(s, .25); });
C('cluster', 'Cluster Drop', 1, 'block', 'Blocking scatters six small bombs.', [['+', 'Block: 6 bombs'], ['+', '+30% HP'], B25], s => { hp(s, .3); bc(s, .25); });
C('reprise', 'Reprise', 1, 'block', 'Blocking triggers a second, slightly delayed block.', [['+', 'Block repeats once'], ['+', '+30% HP'], B25], s => { hp(s, .3); bc(s, .25); });
C('pulse', 'Pulse Ring', 1, 'block', 'Blocking spawns a ring of weak projectiles that slow enemies.', [['+', 'Block: slowing projectile ring'], ['+', '+30% HP'], B25], s => { hp(s, .3); bc(s, .25); });
C('gravwell', 'Gravity Well', 1, 'block', 'Blocking pulls enemies toward you.', [['+', 'Block: pull enemies in'], ['+', '+50% HP'], B25], s => { hp(s, .5); bc(s, .25); });
C('overload', 'Overload', 1, 'block', 'Blocking blasts nearby enemies for a share of your max HP.', [['+', 'Block: damage by max HP'], ['+', '+30% HP'], B25], s => { hp(s, .3); bc(s, .25); });
C('returnfire', 'Return Fire', 1, 'block', 'Blocking auto-fires a shot at the nearest enemy.', [['+', 'Block: auto-aimed shot'], ['+', '+30% HP'], B25], s => { hp(s, .3); bc(s, .25); });
C('bullrush', 'Bull Rush', 1, 'block', 'Blocking launches you forward, then blocks again when you land the dash.', [['+', 'Block: dash + second block'], B25], s => { bc(s, .25); });
C('repulse', 'Repulse', 1, 'block', 'Blocking blasts enemies away from you.', [['+', 'Block: knock enemies away'], ['+', '+50% HP'], B25], s => { hp(s, .5); bc(s, .25); });

function priceOf(id) { const base = RUN_PRICE[CARDS[id].rar], k = 1 + (M.run.floor - 1) * .08; return Math.round(base * k / 5) * 5; }
function shopStock(p) {
  const ids = [];
  const SPOOL = p.wand && p.wand.el ? EL_CARDS[p.wand.el] : SPELL_LIST;
  for (let i = 0; i < 2; i++) ids.push(shopPick(SPOOL, p, ids));
  ids.push(shopPick(UPGRADE_LIST, p, ids)); ids.push(shopPick(WANDUP_LIST, p, ids)); ids.push(shopPick(PERK_LIST, p, ids));
  const items = ids.filter(Boolean).map(id => ({ id, price: priceOf(id), sold: false }));
  items.push({ id: 'mystery', price: 45, sold: false, mystery: true });
  return items;
}
function nextShopper() {
  if (!M) return;
  if (SHOP.idx >= 2) { SHOP = null; M.run.floor++; app = 'match'; show(null); wrap.classList.add('play'); startRound(); return; }
  const p = M.players[SHOP.order[SHOP.idx]];
  SHOP.p = p; SHOP.items = shopStock(p); SHOP.reroll = 10; SHOP.line = pick(MERCHANT.hi); SHOP.bought = []; SHOP.mood = 'hi';
  if (p.ctrl.bot) { botShop(p); SHOP.notes.push(`${p.nick} bought ${SHOP.bought.length ? SHOP.bought.join(', ') : 'nothing'}.`); SHOP.idx++; return nextShopper(); }
  app = 'shop'; wrap.classList.remove('play'); show('shop');
}
function mysteryCard(p) {
  // a Rare-or-better spell, wand upgrade or perk, sight unseen
  const EP = p.wand && p.wand.el ? EL_CARDS[p.wand.el] : SPELL_LIST, pools = [EP, EP, EP, PERK_LIST], pool = pick(pools);
  for (let g = 0; g < 200; g++) { const rar = Math.random() < .3 ? 3 : 2, c = pool.filter(id => CARDS[id].rar === rar && !(CARDS[id].uniq && p.cards.includes(id))); if (c.length) return pick(c); }
  return pick(pool);
}
function shopBuy(i) {
  const it = SHOP.items[i], p = SHOP.p, R = M.run; if (!it || it.sold) return;
  if (R.coins[p.id] < it.price) { SHOP.line = pick(MERCHANT.broke); SHOP.mood = 'broke'; sfx(140, .15, 'square', .04, -40); return refreshShop(); }
  R.coins[p.id] -= it.price; R.spent[p.id] += it.price; it.sold = true;
  const id = it.mystery ? mysteryCard(p) : it.id; it.got = id;
  SHOP.line = it.mystery ? `Ohh, the flask held… ${CARDS[id].name}!` : pick(MERCHANT.buy); SHOP.mood = 'buy';
  sfx(990, .08, 'square', .035, 400); setTimeout(() => sfx(1480, .12, 'square', .03, 300), 70);
  const res = grantCard(p, id);
  if (res === 'edit') return openWandEditor(p, id, () => { app = 'shop'; show('shop'); });
  refreshShop();
}
function shopReroll() {
  const p = SHOP.p, R = M.run;
  if (R.coins[p.id] < SHOP.reroll) { SHOP.line = pick(MERCHANT.broke); SHOP.mood = 'broke'; sfx(140, .15, 'square', .04, -40); return refreshShop(); }
  R.coins[p.id] -= SHOP.reroll; R.spent[p.id] += SHOP.reroll; SHOP.reroll += 5;
  SHOP.items = shopStock(p); SHOP.line = pick(MERCHANT.reroll); SHOP.mood = 'hi'; sfx(600, .1, 'triangle', .03, -200);
  refreshShop();
}
function shopLeave() { if (!SHOP) return; SHOP.line = pick(MERCHANT.bye); SHOP.idx++; sfx(330, .2, 'triangle', .03, -120); nextShopper(); }
function refreshShop() { const f = focusIdx; renderShop(); magicDom($('shop')); focusIdx = Math.min(f, navItems().length - 1); markFocus(); }
function botShop(p) {
  const R = M.run;
  for (let n = 0; n < 8; n++) {
    const full = !p.wand.spells.includes(null);
    let best = -1, bs = .5;
    SHOP.items.forEach((it, i) => {
      if (it.sold || it.price > R.coins[p.id]) return;
      const c = it.mystery ? null : CARDS[it.id];
      let sc = it.mystery ? 2.6 : c.rar * 1.4 + 1 + Math.random() * 1.5;
      if (c && c.spell) sc += full ? -1.6 : 1.4;
      if (c && c.upgrade) sc += full ? 2 : .5; if (it.id === 'w_ext') sc += full ? 3 : 1;
      if (sc > bs) { bs = sc; best = i; }
    });
    if (best < 0) break;
    const it = SHOP.items[best]; R.coins[p.id] -= it.price; R.spent[p.id] += it.price; it.sold = true;
    const id = it.mystery ? mysteryCard(p) : it.id; grantCard(p, id); SHOP.bought.push(CARDS[id].name);
  }
}

function runSummaryHTML() {
  const R = M.run; if (!R) return '';

let ctlBack = 'title';
function act(a, v, el) {
  audio();
  switch (a) {
    case 'ctl': ctlBack = v; REB = null; if (v !== 'pause') app = 'menu'; return show('controls');
    case 'ctlback': REB = null; if (ctlBack === 'pause') return show('pause'); return act('go', ctlBack);
    case 'bind': { const [kind, ac, sl] = v.split(':'); REB = { kind, act: ac, slot: +sl, t: performance.now() }; return refreshControls(); }
    case 'dz': SET.dz = +v; saveSet(); return refreshControls();
    case 'ctoggle': SET[v] = !SET[v]; saveSet(); return refreshControls();
    case 'resetctl': SET.keys = DEF_KEYS(); SET.pad = DEF_PAD(); SET.dz = .22; SET.aimLeft = true; SET.rumble = true; REB = null; saveSet(); return refreshControls();
    case 'picks': SET.picks = v; saveSet(); return show('setup');
    case 'demo': return startDemo();
    case 'wslot': case 'wdiscard': case 'wdropnew': case 'wdone': case 'warr': return wandAct(a, v);
    case 'buy': return shopBuy(+v);
    case 'reroll': return shopReroll();
    case 'leave': return shopLeave();
    case 'shopwand': return SHOP && openWandEditor(SHOP.p, null, () => { app = 'shop'; show('shop'); });
    case 'game': { SET.game = v; saveSet(); const on = document.querySelector('.panel.on').id, f = focusIdx; show(on); focusIdx = f; markFocus(); return; }
    case 'weapon': if (WP && !M.players[WP.turn].ctrl.bot) chooseWeapon(+v); return;
    case 'go': app = v === 'title' ? 'title' : 'menu'; M = v === 'title' ? null : M; wrap.classList.remove('play'); return show(v);
    case 'setup': setupMode = v; app = 'menu'; return show('setup');
    case 'bot': SET.bot = v; saveSet(); return show('setup');
    case 'luwho': case 'lucol': { const [i, w] = v.split(':'), L = lineupOf(setupMode === 'bot' ? 'bot' : 'versus'); if (a === 'luwho') L[+i].who = w; else L[+i].col = w; saveSet(); const f = focusIdx; show('setup'); focusIdx = f; markFocus(); return; }
    case 'points': SET.points = +v; saveSet(); return show('setup');
    case 'rounds': SET.rounds = +v; saveSet(); return show('setup');
    case 'toggle': SET[v] = !SET[v]; saveSet(); return show('settings');
    case 'nopen': app = 'online'; show('online'); if (NET.status === 'off') { NET.err = ''; netConnect(); } else netSend({ t: 'list' }); return;
    case 'nconnect': NET.err = ''; return netConnect();
    case 'nback': if (NET.lobby) netSend({ t: 'leave' }); NET.lobby = null; app = 'title'; return show('title');
    case 'ncreate': { const pr = myProfile(); netSend({ t: 'look', name: (pr.name || '').trim() || 'Wizard', look: pr }); return netSend({ t: 'create' }); }
    case 'njoin': { const pr = myProfile(); netSend({ t: 'look', name: (pr.name || '').trim() || 'Wizard', look: pr }); return netSend({ t: 'join', code: v }); }
    case 'njoincode': { const c = (NET.joinCode || '').trim().toUpperCase(); if (c.length !== 4) { NET.err = 'Lobby codes are 4 letters.'; return refreshOnline(); } return act('njoin', c); }
    case 'nleave': netSend({ t: 'leave' }); NET.lobby = null; app = 'online'; show('online'); return netSend({ t: 'list' });
    case 'nready': { const L = NET.lobby, me = L && L.slots.find(s => s.kind === 'human' && s.cid === NET.id); return netSend({ t: 'ready', v: !(me && me.ready) }); }
    case 'nteam': { const [i, c] = v.split(':'); return netSend({ t: 'team', slot: +i, col: c }); }
    case 'naddbot': return netSend({ t: 'addbot' });
    case 'ndelbot': return netSend({ t: 'delbot', slot: +v });
    case 'nopt': { const [k, x] = v.split(':'); return netSend({ t: 'opt', k, v: isNaN(+x) ? x : +x }); }
    case 'nlobby': return backToLobby();
    case 'quitapp': if (window.desktop) window.desktop.quit(); return;
    case 'fullscr': if (window.desktop) window.desktop.toggleFullscreen(); return;
    case 'mapt': case 'mapall': { const off = new Set(SET.mapsOff || []);
      if (a === 'mapt') { const n = MAPS[+v].n; if (off.has(n)) off.delete(n); else { if (MAPS.length - off.size <= 1) { sfx(140, .12, 'square', .04, -40); return; } off.add(n); } } // keep at least one map on
      else { off.clear(); const firstNew = MAPS.findIndex(m => m.n === 'Quarry'); MAPS.forEach((m, i) => { if ((v === '0' && i >= firstNew) || (v === '2' && i < firstNew)) off.add(m.n); }); }
      SET.mapsOff = [...off]; saveSet(); sfx(a === 'mapt' && off.has(MAPS[+v] && MAPS[+v].n) ? 300 : 620, .06, 'square', .025, 100);
      const f = focusIdx; UI.maps(); magicDom($('maps')); focusIdx = f; markFocus(); return; }
    case 'speed': SET.speed = +v; saveSet(); return show('settings');
    case 'ctab': custIdx = +v; return refreshCustom();
    case 'look': SET.prof[custIdx][el.dataset.k] = v; saveSet(); return refreshCustom();
    case 'randlook': { const r = randomLook(SET.prof[1 - custIdx].col); r.name = SET.prof[custIdx].name; SET.prof[custIdx] = r; saveSet(); return refreshCustom(); }
    case 'resetlook': SET.prof[custIdx] = JSON.parse(JSON.stringify(DEFAULT_PROF[custIdx])); saveSet(); return refreshCustom();
    case 'start': return startMatch(setupMode);
    case 'rematch': return startMatch(M.mode);
    case 'card': if (PK && !M.players[PK.pi].ctrl.bot) choose(+v); return;
    case 'pkreroll': if (PK && !M.players[PK.pi].ctrl.bot) reroll(); return;
    case 'resume': return setPause(false);
    case 'quit': if (NET.on) { netSend({ t: 'leave' }); netEndLocal(); NET.lobby = null; return show('online'); } paused = false; M = null; app = 'title'; wrap.classList.remove('play'); return show('title');
  }
}
document.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (!b || b.disabled) return; act(b.dataset.act, b.dataset.v, b); });
function setPause(on) { if (app !== 'match') return; if (NET.on) { NET.overlay = on; show(on ? 'pause' : null); wrap.classList.toggle('play', !on); return; } paused = on; show(on ? 'pause' : null); wrap.classList.toggle('play', !on); }
function uiKey(e) {
  if ($('controls').classList.contains('on') && e.code === 'Escape') return act('ctlback');
  if (app === 'match' && (e.code === 'Escape' || SET.keys.pause.includes(e.code))) return setPause(!paused);
  if (app === 'wpick' && WP && !WP.lock && !M.players[WP.turn].ctrl.bot) {
    const n = WEAPON_LIST.length;
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') { WP.sel = (WP.sel + n - 1) % n; renderWPick(); sfx(500, .04, 'square', .02); }
    if (e.code === 'ArrowRight' || e.code === 'KeyD') { WP.sel = (WP.sel + 1) % n; renderWPick(); sfx(500, .04, 'square', .02); }
    if (e.code === 'Enter' || e.code === 'Space') chooseWeapon(WP.sel);
    if (e.code === 'Escape') { WP = null; M = null; app = 'title'; show('title'); }
  }
  if (app === 'pick' && PK && !M.players[PK.pi].ctrl.bot && !PK.chosen) {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') { PK.sel = (PK.sel + PK.cards.length - 1) % PK.cards.length; renderPick(); }
    if (e.code === 'ArrowRight' || e.code === 'KeyD') { PK.sel = (PK.sel + 1) % PK.cards.length; renderPick(); }
    if (e.code === 'Enter' || e.code === 'Space') choose(PK.sel);
    if (e.code === 'KeyR') reroll();
  }
}
// gamepad menu navigation + pause
let navT = 0;
function pollPads() {
  const ps = pads();
  navT -= 1 / 60;
  for (const gp of ps) {
    const s = padState(gp), pr = PAD.prev[gp.index] || {};
    // menus move exactly one step per D-pad press or stick push (no auto-repeat while held)
    PAD.press[gp.index] = s.btn.map((v, k) => v && !(pr.btn && pr.btn[k]));
    const vDir = (s.down || s.ly > .5) ? 1 : (s.up || s.ly < -.5) ? -1 : 0, hDir = (s.right || s.lx > .5) ? 1 : (s.left || s.lx < -.5) ? -1 : 0;
    const was = PAD.dir[gp.index] || { v: 0, h: 0 };
    PAD.vEdge[gp.index] = vDir !== was.v ? vDir : 0; PAD.hEdge[gp.index] = hDir !== was.h ? hDir : 0; PAD.dir[gp.index] = { v: vDir, h: hDir };
    if (s.btn.some(v => v) || Math.abs(s.lx) > .5) { if (!usingPad) { usingPad = true; markFocus(); } audio(); }
    if (DEMO.on) { if (s.btn.some((v, k) => v && !(pr.btn && pr.btn[k]))) { PAD.prev[gp.index] = s; exitDemo(); return; } PAD.prev[gp.index] = s; continue; }
    if (REB && REB.kind === 'pad') {
      const i = s.btn.findIndex((v, k) => v && !(pr.btn && pr.btn[k]));
      if (i >= 0 && performance.now() - REB.t > 200) assignPad(i);
      PAD.prev[gp.index] = s; continue;
    }
    const ctlOn = $('controls').classList.contains('on');
    if (ctlOn) { const el = $('padTest'); if (el) { const on = s.btn.map((v, k) => v ? padLabel(k) : null).filter(Boolean).join(' + '); const txt = on || 'Press buttons to see their names'; if (el.textContent !== txt) el.textContent = txt; } }
    if (app === 'match' && !ctlOn && padEdge(s, pr, 'pause')) setPause(!paused);
    const menuOpen = document.querySelector('.panel.on') && app !== 'pick' && app !== 'wpick';
    if (menuOpen) {
      const dir = PAD.vEdge[gp.index] || PAD.hEdge[gp.index];
      if (dir) { const it = navItems(); if (it.length) { focusIdx = (focusIdx + dir + it.length) % it.length; markFocus(); it[focusIdx].scrollIntoView({ block: 'nearest' }); sfx(500, .03, 'square', .015); } }
      if (PAD.press[gp.index][0]) { const it = navItems(); PAD.press[gp.index] = []; if (it[focusIdx]) it[focusIdx].click(); } // consumed: the next screen can't see this press
      if (s.bb && !pr.bb) { if (ctlOn) act('ctlback'); else if (app === 'menu') act('go', 'title'); else if (paused) setPause(false); }
    }
    PAD.prev[gp.index] = s;
  }
  if (app === 'title' || app === 'menu') { const n = ps.length; if (n !== pollPads.n) { pollPads.n = n; const on = document.querySelector('.panel.on'); if (on && (on.id === 'title' || on.id === 'setup')) { const f = focusIdx; UI[on.id](); focusIdx = f; markFocus(); } } }
}
addEventListener('gamepadconnected', () => { usingPad = true; });
show('title');
