.card{width:11.5em;min-height:16.5em;background:linear-gradient(#150f2e,#08061a);color:var(--ink);border-radius:8px;padding:.8em .8em 1em;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:center;position:relative;transition:transform .12s,box-shadow .12s;border:2px solid var(--c0);box-shadow:0 0 10px rgba(200,212,234,.2),inset 0 0 14px rgba(200,212,234,.06);font-family:Rajdhani}

@keyframes lg{from{box-shadow:0 0 12px rgba(255,177,61,.35),inset 0 0 16px rgba(255,177,61,.1)}to{box-shadow:0 0 30px rgba(255,177,61,.75),inset 0 0 26px rgba(255,177,61,.2)}}

.minis{display:flex;gap:.3em;flex-wrap:wrap;justify-content:center;max-width:40em}

.decks{display:flex;gap:2em;justify-content:center;margin-top:1.4em;flex-wrap:wrap}

.cust{display:flex;gap:1.6em;align-items:flex-start;justify-content:center;flex-wrap:wrap;max-width:62em}

#prevC{width:22em;height:17em;background:radial-gradient(#1a0f3a,#05030f);border:1px solid #3a2a7a;border-radius:6px;box-shadow:0 0 22px rgba(155,92,255,.3)}

/* ===================== RETRO SHOT THEME ===================== */
:root{--p1:#ff9a2e;--p2:#36e0ff;--ink:#eadcc0;--dim:#9c8a70;--c0:#8a8070;--c1:#4f8fd0;--c2:#a65ad6;--gold:#e0a530}
html,body{background:#050403}
#wrap{box-shadow:none;border:0}
canvas{image-rendering:pixelated}
*{font-family:'VT323','Courier New',monospace}
h1,h2,h3,.btn,.pickhead,.score,.card .n,.card .ty,.card .rar,.row .n,.pad b,.keys b,.wcard .n,.wtag,.mini,.nm{font-family:'Press Start 2P','Courier New',monospace!important}
.panel{background:rgba(8,6,4,.78);font-size:1.15em}
h1{font-size:3.1em;letter-spacing:.04em;line-height:1.2;margin-bottom:.15em}
h1 .a{color:#ffcf6a;text-shadow:.12em .12em 0 #6a2a08,.2em .2em 0 #000}
h1 .b{color:#ff8a3a;text-shadow:.12em .12em 0 #5a1a04,.2em .2em 0 #000}
h2{font-size:1.25em;color:#ffd27a;text-shadow:.15em .15em 0 #000;letter-spacing:.04em}
h3{font-size:.55em;color:#c9a874;text-shadow:.15em .15em 0 #000;letter-spacing:.12em}
.sub{color:#b8a688;font-size:1.25em}
.hint{color:#9c8a70;font-size:1.15em}
.btn{background:#1d1813;border:3px solid #4a3b2c;border-radius:0;color:#eadcc0;font-size:.62em;letter-spacing:.06em;padding:.9em 1.5em;box-shadow:0 .35em 0 #000;min-width:20em;transition:none}
.btn.small{font-size:.5em;padding:.8em 1.1em;min-width:0}
.btn:hover,.btn.focus{background:#2a2118;border-color:#d9a441;color:#ffd27a;box-shadow:0 .35em 0 #000;transform:translateY(-2px)}
.btn.sel{background:#1f2a17;border-color:#7fbf4f;color:#d8f5c0;box-shadow:0 .35em 0 #000}
.btn:disabled{opacity:.35}
.btn.wait{animation:none;border-color:#e0a530;background:#3a2a10}
.row{background:#16120e;border:3px solid #3a2e22;border-radius:0}
.row .n{font-size:.55em;color:#eadcc0}.row .d{color:#9c8a70;font-size:1.05em}
.pad{background:#16120e;border-radius:0;border-width:3px}.pad b{font-size:.6em}
.pad.p1{box-shadow:none}.pad.p2{box-shadow:none}
.card{background:#17120e;border:3px solid #6a5a4a;border-radius:0;box-shadow:0 .3em 0 #000;font-family:'VT323',monospace}
.card.r1{border-color:#4f8fd0;box-shadow:0 .3em 0 #000}.card.r2{border-color:#a65ad6;box-shadow:0 .3em 0 #000}
.card.r3{border-color:#e0a530;background:#21170c;animation:lgr 1s steps(2) infinite}

.card.wpn{border-color:#d9a441;box-shadow:0 .3em 0 #000}
.card.focus,.card:hover{transform:translateY(-8px);box-shadow:0 .3em 0 #000,0 0 0 3px #ffd27a}
.card.chosen{transform:translateY(-18px);box-shadow:0 .3em 0 #000,0 0 0 4px #fff}
.card .ty{font-size:.42em;color:#9c8a70}.card .n{font-size:.62em;line-height:1.4;color:#eadcc0}.card.r3 .n{color:#ffd27a}
.card .d{font-size:1.1em;color:#b8a688;line-height:1}
.card .l{font-size:1.05em;border-radius:0}
.card .l.p{color:#9ee07a;background:#1a2614}.card .l.m{color:#ff8a7a;background:#2a1412}
.card .kb{align-self:stretch;margin:-.8em -.8em .3em;padding:.5em .55em;display:flex;justify-content:space-between;align-items:center;gap:.4em;font-family:'Press Start 2P',monospace;font-size:.44em;letter-spacing:.05em;color:#140c06;text-align:left}

<script>
'use strict';
/* =====================================================================
   RETRO SHOT — pixel/powder edition of Shapeshot (same simulation, different renderer)
   Structure: DATA (cards, maps) · SIM (fixed 60 Hz, input-driven) ·
   INPUT (keyboard/mouse, gamepads, bot) · RENDER · UI
   The sim only reads per-player input objects so it can later be driven
   by a network server.
   ===================================================================== */
// SW x SH is the screen (and every classic arena); W x H is the current world, which roguelike levels make bigger
const SW = 1280, SH = 720; let W = SW, H = SH; const TAU = Math.PI * 2, DT = 1 / 60;
const cv = document.getElementById('cv'), ctx = cv.getContext('2d'), wrap = document.getElementById('wrap');
const rnd = (a, b) => a + Math.random() * (b - a), clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pick = a => a[Math.floor(Math.random() * a.length)];
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
let scale = 1;
function fit() {
  const s = Math.min(innerWidth / SW, innerHeight / SH);
  const w = Math.floor(SW * s), h = Math.floor(SH * s); scale = s;
  wrap.style.width = w + 'px'; wrap.style.height = h + 'px'; wrap.style.fontSize = (16 * Math.max(.55, s)) + 'px';
  const dpr = Math.min(2, devicePixelRatio || 1);
  cv.width = Math.floor(w * dpr); cv.height = Math.floor(h * dpr);
  ctx.setTransform(cv.width / SW, 0, 0, cv.height / SH, 0, 0);
}
addEventListener('resize', fit); fit();

let AC = null; const sl = {};
function audio() { if (!SET.sound) return; try { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch (e) {} }
function sfx(f, d = .08, type = 'square', vol = .05, slide = 0, key) {
  if (!SET.sound || !AC) return;
  if (key) { const n = performance.now(); if (n - (sl[key] || 0) < 40) return; sl[key] = n; }
  try {
    const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d + .02);
  } catch (e) {}
}
function noise(d = .15, vol = .08) {
  if (!SET.sound || !AC) return;
  try { const n = AC.sampleRate * d, buf = AC.createBuffer(1, n, AC.sampleRate), ch = buf.getChannelData(0); for (let i = 0; i < n; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / n); const s = AC.createBufferSource(), g = AC.createGain(); g.gain.value = vol; s.buffer = buf; s.connect(g); g.connect(AC.destination); s.start(); } catch (e) {}
}

/* ============================ DUNGEON RUN ============================
   Five floors, best of three rounds on each. Wizards earn coins for what they do in a fight,
   then spend them with the merchant between floors. Wands, spells and perks carry over. */
const FLOOR_NAMES = ['The Upper Mines', 'Fungal Hollow', 'Frozen Vault', 'Sunken Library', 'The Furnace'];
const COIN_RULES = [
  ['Damage', '1 coin per 10 damage dealt'], ['Kills', '12 per kill'], ['Rounds won', '10 per round won'], ['Flawless', '10 for winning a round untouched'],
  ['Close calls', '8 for winning a round below 20% health'], ['Wards', '1 per ward cast'], ['Warded bolts', '2 per enemy bolt your ward stops (up to 10 a round)'],
  ['Bolt clashes', '2 when your bolt destroys an enemy bolt (up to 8 a round)'], ['Trick shots', '3 per hit with a bolt that bounced first, bubbles excluded (up to 9 a round)'], ['Crits', '1 per critical hit'],
  ['Terrain smashed', 'for chewing up terrain (up to 6 a round)'], ['Ropes cut', '3 per rope cut'], ['Delving', '5 to everyone each round'], ['Underdog', '20 for the wizard who lost the floor']
];
const RUN_PRICE = [20, 35, 60, 100];
let CUR_OWNER = -1;   // whose bolt / blast is touching the world right now (for terrain coins)

function newRun() { return { floor: 1, floors: 5, rw: [0, 0], fw: [0, 0], coins: [0, 0], frac: [0, 0], earned: [{}, {}], total: [{}, {}], spent: [0, 0], log: [] }; }
function inRun() { return M && (M.game === 'dungeon' || M.game === 'rogue') && M.run; }

const COIN_CAP = { 'Trick shots': 9, 'Bolt clashes': 8, 'Warded bolts': 10, 'Terrain smashed': 6 };
function coin(pid, n, why, x, y) {
  const R = inRun(); if (!R || pid !== 0 && pid !== 1 || n <= 0 || (M.players[pid] && M.players[pid].mob)) return;
  if (COIN_CAP[why]) { const cc = M.coinCap || (M.coinCap = {}), k = pid + why, used = cc[k] || 0; n = Math.min(n, COIN_CAP[why] - used); if (n <= 0) return; cc[k] = used + n; }
  R.frac[pid] += n; const whole = Math.floor(R.frac[pid] + 1e-6); if (whole <= 0) return;
  R.frac[pid] -= whole; R.coins[pid] += whole;
  R.earned[pid][why] = (R.earned[pid][why] || 0) + whole; R.total[pid][why] = (R.total[pid][why] || 0) + whole;
  if (x !== undefined && SET.nums) M.nums.push({ x: x + rnd(-6, 6), y: y - 18, v: '+' + whole + '¢', t: .9, col: '#ffd23d' });
}
function coinOf(p) { return inRun() ? M.run.coins[p.id] : 0; }

/* called from endRound */
function dungeonEndRound(w) {
  const R = M.run, l = 1 - w, wp = M.players[w];
  coin(w, 10, 'Rounds won', wp.x, wp.y - 20);
  if (!wp.hurt) coin(w, 10, 'Flawless', wp.x, wp.y - 34);
  else if (wp.hp > 0 && wp.hp < wp.st.maxHp * .2) coin(w, 8, 'Close calls', wp.x, wp.y - 34);
  coin(0, 5, 'Delving'); coin(1, 5, 'Delving');
  R.rw[w]++; M.rw = R.rw.slice(); M.lastLoser = l;
  if (R.rw[w] < 2) return startRound();
  // floor cleared
  R.fw[w]++; M.points = R.fw.slice(); R.rw = [0, 0]; M.rw = [0, 0]; R.lastWin = w; coin(l, 20, 'Underdog');
  if (R.floor >= R.floors) { M.phase = 'over'; app = 'end'; wrap.classList.remove('play'); show('end'); sfx(523, .2, 'square', .04); setTimeout(() => sfx(784, .4, 'square', .04), 150); return; }
  openMerchant(l);
}

/* ---------- a co-op bot for Delve: heads for the door, keeps near its friend, shoots what it sees, grabs loot ---------- */
function rogueBot(p) {

    if (!L.door && B.tg) { gx = clamp(gx, 80, W - 80); if (Math.abs(gx - p.x) < 40) gx = p.x + (Math.random() < .5 ? -200 : 200); }

  const dir = o.mx || Math.sign(Math.cos(o.aim)) || 1;
  const gapAhead = p.onGround && o.mx && !solidAt(p.x + dir * 46, p.y + p.r + 30, M.solids) && !solidAt(p.x + dir * 46, p.y + p.r + 180, M.solids);

  return o;
}

document.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (!b || b.disabled) return; act(b.dataset.act, b.dataset.v, b); });
// B on a controller / Esc on the keyboard: back out of whatever menu is open

  const on = document.querySelector('.panel.on'), id = on && on.id;
  if (app === 'match') return NET.on ? setPause(!NET.overlay) : setPause(!paused);
  if (id === 'lobby') return act('nleave');
  if (id === 'online') return act('nback');
  if (['settings', 'help', 'maps', 'custom', 'setup', 'library'].includes(id)) { sfx(300, .05, 'square', .02, -80); return act('go', 'title'); }
}
function setPause(on) { if (app !== 'match') return; if (NET.on) { NET.overlay = on; show(on ? 'pause' : null); wrap.classList.toggle('play', !on); return; } paused = on; show(on ? 'pause' : null); wrap.classList.toggle('play', !on); }
function uiKey(e) {
  if ($('controls').classList.contains('on') && e.code === 'Escape') return act('ctlback');
  if (app === 'match' && (e.code === 'Escape' || SET.keys.pause.includes(e.code))) return NET.on ? setPause(!NET.overlay) : setPause(!paused);
  if (e.code === 'Escape' && !(document.activeElement && document.activeElement.tagName === 'INPUT' && document.activeElement.value)) return goBack();
  if (app === 'wpick' && WP && !WP.lock && !M.players[WP.turn].ctrl.bot) {
    const n = WEAPON_LIST.length;
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') { WP.sel = (WP.sel + n - 1) % n; renderWPick(); sfx(500, .04, 'square', .02); }
    if (e.code === 'ArrowRight' || e.code === 'KeyD') { WP.sel = (WP.sel + 1) % n; renderWPick(); sfx(500, .04, 'square', .02); }
    if (e.code === 'Enter' || e.code === 'Space') chooseWeapon(WP.sel);
    if (e.code === 'Escape') { WP = null; M = null; app = 'title'; show('title'); }
  }
  if (app === 'pick' && PK && !M.players[PK.pi].ctrl.bot && !PK.chosen) {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') { PK.sel = (PK.sel + PK.cards.length - 1) % PK.cards.length; renderPick(); }
    if (e.code === 'ArrowRight' || e.code === 'KeyD') { PK.sel = (PK.sel + 1) % PK.cards.length; renderPick(); }

}
// gamepad menu navigation + pause
let navT = 0;
function pollPads() {
  const ps = pads();

  for (const gp of ps) {
    const s = padState(gp), pr = PAD.prev[gp.index] || {};
    // menus move one step per D-pad press or stick push; holding it scrolls after a short pause, like most games
    PAD.press[gp.index] = s.btn.map((v, k) => v && !(pr.btn && pr.btn[k]));
    const vDir = (s.down || s.ly > .5) ? 1 : (s.up || s.ly < -.5) ? -1 : 0, hDir = (s.right || s.lx > .5) ? 1 : (s.left || s.lx < -.5) ? -1 : 0;
    const was = PAD.dir[gp.index] || { v: 0, h: 0 }, rp = PAD.rep[gp.index] || (PAD.rep[gp.index] = { v: 0, h: 0 });

    if (hDir && hDir === was.h) { rp.h += 1 / 60; if (rp.h > .4) { rp.h -= .07; hE = hDir; } } else rp.h = 0;
    PAD.vEdge[gp.index] = vE; PAD.hEdge[gp.index] = hE; PAD.dir[gp.index] = { v: vDir, h: hDir };
    if (s.btn.some(v => v) || Math.abs(s.lx) > .5) { if (!usingPad) { usingPad = true; markFocus(); } audio(); }
    if (DEMO.on) { if (s.btn.some((v, k) => v && !(pr.btn && pr.btn[k]))) { PAD.prev[gp.index] = s; exitDemo(); return; } PAD.prev[gp.index] = s; continue; }
    if (REB && REB.kind === 'pad') {
      const i = s.btn.findIndex((v, k) => v && !(pr.btn && pr.btn[k]));
      if (i >= 0 && performance.now() - REB.t > 200) assignPad(i);
      PAD.prev[gp.index] = s; continue;
    }
    const ctlOn = $('controls').classList.contains('on');
    if (ctlOn) { const el = $('padTest'); if (el) { const on = s.btn.map((v, k) => v ? padLabel(k) : null).filter(Boolean).join(' + '); const txt = on || 'Press buttons to see their names'; if (el.textContent !== txt) el.textContent = txt; } }
    if (app === 'match' && !ctlOn && padEdge(s, pr, 'pause')) setPause(!paused);
    const menuOpen = document.querySelector('.panel.on') && app !== 'pick' && app !== 'wpick';
    if (menuOpen) {
      const dir = PAD.vEdge[gp.index] || PAD.hEdge[gp.index];

}
